spring.application.name=hotel-booking
server.port=8080

# Database credentials come from environment variables - never commit real values.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:hotel_user}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema (see db/migration), Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Origins allowed to call the API (the Angular dev server by default).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
